<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8" shape-rendering="crispEdges">
  <!-- Classic Mac 50% dither: 1px checkerboard, black on white. -->
  <defs>
    <pattern id="p50" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#ffffff"/>
      <rect width="1" height="1" fill="#000000"/>
      <rect x="1" y="1" width="1" height="1" fill="#000000"/>
    </pattern>
  </defs>
  <rect width="8" height="8" fill="url(#p50)"/>
</svg>
